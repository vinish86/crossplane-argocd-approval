---
# ClusterRole to allow ArgoCD to manage Pausable and Approval resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-pausable-approval-manager
rules:
# Allow ArgoCD to manage Pausable resources (for custom action PATCH)
- apiGroups:
  - example.io
  resources:
  - pausables
  - pausables/status
  verbs:
  - get
  - list
  - watch
  - patch
  - update

# Allow ArgoCD to manage XPausable resources
- apiGroups:
  - example.io
  resources:
  - xpausables
  - xpausables/status
  verbs:
  - get
  - list
  - watch
  - patch
  - update

# Allow ArgoCD to manage Approval resources
- apiGroups:
  - example.io
  resources:
  - approvals
  - approvals/status
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
  - delete

# Allow ArgoCD to manage XApproval resources
- apiGroups:
  - example.io
  resources:
  - xapprovals
  - xapprovals/status
  verbs:
  - get
  - list
  - watch

# Allow ArgoCD to manage ChildPausable resources
- apiGroups:
  - example.io
  resources:
  - childpausables
  - xchildpausables
  verbs:
  - get
  - list
  - watch

---
# ClusterRoleBinding to bind the role to ArgoCD server service account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-pausable-approval-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-pausable-approval-manager
subjects:
- kind: ServiceAccount
  name: argocd-server
  namespace: argocd
- kind: ServiceAccount
  name: argocd-application-controller
  namespace: argocd

