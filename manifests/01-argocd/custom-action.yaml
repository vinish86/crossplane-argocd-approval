apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # Reduce sync timeout for faster change detection (default is 3 minutes)
  timeout.reconciliation: 30s
  # Custom action for Pausable resources (namespaced claims)
  resource.customizations.actions.example.io_Pausable: |
    discovery.lua: |
      actions = {}
      -- Check if resource is paused by looking at status.approvalStatus
      -- When approvalStatus is "false" and previousHash != "initialValue", it means the resource is paused waiting for approval
      if obj.status ~= nil and obj.status.approvalStatus == "false" and obj.status.previousHash ~= nil and obj.status.previousHash ~= "initialValue" then
        actions["approve"] = {
          iconClass = "fa fa-check-circle",
          displayName = "✓ Approve Change"
        }
      end
      return actions

    definitions:
    - name: approve
      action.lua: |
        -- Add approval annotation directly to the Pausable resource
        -- This allows ArgoCD to modify the resource it's viewing (PATCH works!)
        local newObj = obj
        
        -- Initialize annotations if they don't exist
        if newObj.metadata.annotations == nil then
          newObj.metadata.annotations = {}
        end
        
        -- Add approval annotations with current hash and metadata
        if obj.status ~= nil and obj.status.currentHash ~= nil then
          newObj.metadata.annotations["approval.example.io/approved-hash"] = obj.status.currentHash
          newObj.metadata.annotations["approval.example.io/approved-by"] = "argocd-admin"
          newObj.metadata.annotations["approval.example.io/approved-via"] = "argocd-ui"
        end
        
        return newObj
  
  # Also add custom action for cluster-scoped XPausable resources  
  resource.customizations.actions.example.io_XPausable: |
    discovery.lua: |
      actions = {}
      -- Check if resource is paused
      if obj.status ~= nil and obj.status.approvalStatus == "false" and obj.status.previousHash ~= nil and obj.status.previousHash ~= "initialValue" then
        actions["approve"] = {
          iconClass = "fa fa-check-circle",
          displayName = "✓ Approve Change"
        }
      end
      return actions

    definitions:
    - name: approve
      action.lua: |
        -- Add approval annotation directly to the XPausable resource
        local newObj = obj
        
        -- Initialize annotations if they don't exist
        if newObj.metadata.annotations == nil then
          newObj.metadata.annotations = {}
        end
        
        -- Add approval annotations with current hash and metadata
        if obj.status ~= nil and obj.status.currentHash ~= nil then
          newObj.metadata.annotations["approval.example.io/approved-hash"] = obj.status.currentHash
          newObj.metadata.annotations["approval.example.io/approved-by"] = "argocd-admin"
          newObj.metadata.annotations["approval.example.io/approved-via"] = "argocd-ui"
        end
        
        return newObj
