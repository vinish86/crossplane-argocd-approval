apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
data:
  # RBAC Policy Configuration
  policy.csv: |
    # Admin role - full access
    p, role:admin, applications, *, */*, allow
    p, role:admin, clusters, *, *, allow
    p, role:admin, repositories, *, *, allow
    p, role:admin, certificates, *, *, allow
    p, role:admin, projects, *, *, allow
    p, role:admin, accounts, *, *, allow
    p, role:admin, gpgkeys, *, *, allow
    p, role:admin, logs, *, *, allow
    p, role:admin, exec, *, *, allow
    
    # Approver role - can view and approve changes
    p, role:approver, applications, get, */*, allow
    p, role:approver, applications, sync, */*, allow
    p, role:approver, applications, action/*, */*, allow
    p, role:approver, repositories, get, *, allow
    p, role:approver, clusters, get, *, allow
    p, role:approver, projects, get, *, allow
    
    # Reader role - can only view
    p, role:reader, applications, get, */*, allow
    p, role:reader, repositories, get, *, allow
    p, role:reader, clusters, get, *, allow
    p, role:reader, projects, get, *, allow
    
    # Assign users to roles
    g, admin, role:admin
    g, approver, role:approver
    g, reader, role:reader
