apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xslacknotifications.example.io
spec:
  group: example.io
  names:
    kind: XSlackNotification
    plural: xslacknotifications
  claimNames:
    kind: SlackNotification
    plural: slacknotifications
  defaultCompositionRef:
    name: slack-notification-composition
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                message:
                  type: string
                  description: "The message to send to Slack"
                channel:
                  type: string
                  description: "Optional channel information (for display purposes)"
              required:
                - message
            status:
              type: object
              properties:
                sentAt:
                  type: string
                  description: "Timestamp when the notification was sent"
                response:
                  type: string
                  description: "Response from Slack webhook"


